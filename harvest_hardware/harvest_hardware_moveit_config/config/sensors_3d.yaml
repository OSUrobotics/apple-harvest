/**:
  ros__parameters:
    sensors:
      - base_realsense_cloud

    base_realsense_cloud:
      sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
      point_cloud_topic: /camera/base_camera/depth/color/points 
      max_range: 5.0
      point_subsample: 1
      padding_offset: 0.03
      padding_scale: 4.0
      max_update_rate: 1.0
      filtered_cloud_topic: /camera/base_camera/filtered_cloud
